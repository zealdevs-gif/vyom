    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(ellipse 65% 50% at 20% 20%, rgba(163, 230, 53, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse 70% 55% at 80% 80%, rgba(34, 197, 94, 0.12) 0%, transparent 50%),
                linear-gradient(160deg, #0a1628 0%, #061018 45%, #02080c 100%);
            color: #fff;
            padding: 40px 16px;
            overflow-x: hidden;
        }

        .wrap {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            padding: 28px 24px 26px;
            border-radius: 20px;
            background: linear-gradient(165deg, rgba(12, 28, 42, 0.92) 0%, rgba(6, 16, 24, 0.95) 100%);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(163, 230, 53, 0.35);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 0 48px rgba(132, 204, 22, 0.12),
                0 24px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #a3e635, #4ade80, #a3e635, transparent);
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 6px;
            background: rgba(163, 230, 53, 0.12);
            border: 1px solid rgba(163, 230, 53, 0.4);
            color: #bef264;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .profile-wrap {
            position: relative;
            width: 118px;
            height: 118px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-spinner {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(#bef264, #84cc16, #22c55e, #a3e635, #bef264);
            animation: spinBorder 2.4s linear infinite;
            box-shadow: 0 0 24px rgba(163, 230, 53, 0.4);
        }

        .profile-spinner::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: #0a1628;
        }

        .profile {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 3px solid #0a1628;
        }

        @keyframes spinBorder {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 14px;
            background: linear-gradient(90deg, #f7fee7, #bef264);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .content {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.82);
            margin-bottom: 16px;
        }

        .feature-bars {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0 0 22px;
        }

        .feature-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(163, 230, 53, 0.18);
            text-align: left;
        }

        .feature-bar i {
            color: #a3e635;
            font-size: 16px;
            width: 22px;
            text-align: center;
        }

        .feature-bar span {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #fff;
        }

        .timer {
            font-size: 14px;
            font-weight: 600;
            margin-top: 18px;
            color: #fff;
        }

        .timer span {
            color: #a3e635;
            font-weight: 800;
        }

        .footer {
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(180deg, #a3e635 0%, #65a30d 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            color: #0a1628;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            box-shadow: 0 0 28px rgba(163, 230, 53, 0.45);
            animation: jump 1.35s ease-in-out infinite;
            z-index: 1;
        }

        .btn .tg-icon {
            color: #0a1628;
            font-size: 18px;
        }

        @keyframes jump {
            0%, 55%, 100% { transform: translateY(0); }
            20% { transform: translateY(-14px); }
            35% { transform: translateY(0); }
            45% { transform: translateY(-7px); }
        }

        @media (max-width: 420px) {
            .card {
                padding: 24px 18px 22px;
            }

            h1 {
                font-size: 18px;
            }

            .btn {
                font-size: 13px;
                padding: 13px 14px;
            }
        }
    </style>

</head>
